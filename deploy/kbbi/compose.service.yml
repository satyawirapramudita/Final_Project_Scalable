name: kbbi-service

services:
  kbbi-linker:
    build:
      context: ../..
      dockerfile: services/kbbi-linker/Dockerfile
    image: ${KBBI_IMAGE:-kbbi-linker:local}
    restart: unless-stopped
    environment:
      SERVICE_NAME: kbbi-linker
      PORT: "8005"

      DB_HOST: ${KBBI_DB_HOST:?KBBI_DB_HOST wajib diisi}
      DB_PORT: ${KBBI_DB_PORT:-3306}
      DB_NAME: ${KBBI_DB_NAME:-kbbi_db}
      DB_USER: ${KBBI_DB_USER:-kbbi_user}
      DB_PASSWORD: ${KBBI_DB_PASSWORD:?KBBI_DB_PASSWORD wajib diisi}
      DB_POOL_SIZE: ${KBBI_DB_POOL_SIZE:-8}
      DB_POOL_TIMEOUT: ${KBBI_DB_POOL_TIMEOUT:-2}

      REDIS_HOST: ${KBBI_REDIS_HOST:?KBBI_REDIS_HOST wajib diisi}
      REDIS_PORT: ${KBBI_REDIS_PORT:-6379}

      RABBITMQ_HOST: ${KBBI_RABBITMQ_HOST:?KBBI_RABBITMQ_HOST wajib diisi}
      RABBITMQ_PORT: ${KBBI_RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-puisi}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD wajib diisi}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      CONSUMER_PREFETCH: ${KBBI_CONSUMER_PREFETCH:-1}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

      KBBI_DATASET_VERSION: ${KBBI_DATASET_VERSION:-kbbi-v-local}
      KBBI_ENTRY_CACHE_TTL_SECONDS: ${KBBI_ENTRY_CACHE_TTL_SECONDS:-2592000}
      KBBI_POEM_CACHE_TTL_SECONDS: ${KBBI_POEM_CACHE_TTL_SECONDS:-86400}
      KBBI_NEGATIVE_CACHE_TTL_SECONDS: ${KBBI_NEGATIVE_CACHE_TTL_SECONDS:-86400}
      KBBI_MAX_TERMS_PER_POEM: ${KBBI_MAX_TERMS_PER_POEM:-30}
    ports:
      - "${KBBI_BIND_ADDRESS:-0.0.0.0}:${KBBI_SERVICE_PORT:-8005}:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
