# ─────────────────────────────────────────────────────────────
# Gerbang tunggal: routing /api/* ke layanan + frontend statis.
# Pemilik: Lindra.
# ─────────────────────────────────────────────────────────────

upstream auth_upstream      { server auth:8001; }
upstream poem_upstream      { server poem:8002; }
upstream wordcloud_upstream { server wordcloud:8003; }
upstream search_upstream    { server search:8004; }
upstream wiki_upstream      { server wiki-linker:8005; }
upstream tts_upstream       { server tts:8006; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Header korelasi untuk seluruh request (dipakai lintas layanan)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # ── Frontend statis ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API ──
    # Catatan: proxy_pass TANPA path agar path lengkap diteruskan
    # (mis. /api/auth/register tetap utuh ke layanan auth).
    location /api/auth/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://auth_upstream;
    }

    location /api/poems {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://poem_upstream;
    }

    location /api/wordcloud/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://wordcloud_upstream;
    }

    location /api/search {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://search_upstream;
    }

    location /api/wiki/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://wiki_upstream;
    }

    location /api/tts/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://tts_upstream;
    }

    # ── Blokir akses internal dari luar ──
    location /internal/ {
        return 404;
    }
}
