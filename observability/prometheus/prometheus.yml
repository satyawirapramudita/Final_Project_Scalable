# Prometheus: scrape /metrics dari semua layanan.
#
# Layanan HTTP ditemukan lewat DNS Docker (dns_sd_configs, tipe A): bila sebuah
# layanan di-scale (docker compose up -d --scale search=3), semua replikanya
# otomatis ikut di-scrape tanpa mengubah file ini. Interval 5 dtk agar panel
# Grafana cukup rapat saat uji beban.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Alert rule (DLQ, outbox, node RabbitMQ, breaker, error 5xx). Status alert
# terlihat di Prometheus → Alerts (http://localhost:9090/alerts).
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth
    dns_sd_configs: [{ names: [auth], type: A, port: 8001, refresh_interval: 5s }]
  - job_name: poem
    dns_sd_configs: [{ names: [poem], type: A, port: 8002, refresh_interval: 5s }]
  - job_name: wordcloud
    dns_sd_configs: [{ names: [wordcloud], type: A, port: 8003, refresh_interval: 5s }]
  - job_name: search
    dns_sd_configs: [{ names: [search], type: A, port: 8004, refresh_interval: 5s }]
  - job_name: kbbi-linker
    dns_sd_configs: [{ names: [kbbi-linker], type: A, port: 8005, refresh_interval: 5s }]
  - job_name: nlp-worker
    dns_sd_configs: [{ names: [nlp-worker], type: A, port: 8100, refresh_interval: 5s }]

  # Gateway: stub_status nginx lewat exporter (jumlah request, koneksi aktif).
  # Satu exporter per instans gateway (gateway-a dan gateway-b).
  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { gateway: gateway-a }
      - targets: ["nginx-exporter-b:9113"]
        labels: { gateway: gateway-b }

  # RabbitMQ: metrik agregat per node (plugin rabbitmq_prometheus, port 15692).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbit-1:15692", "rabbit-2:15692", "rabbit-3:15692"]

  # RabbitMQ per-queue: kedalaman, unacked, jumlah consumer (termasuk *.dlq).
  # Quorum queue dilaporkan oleh node leader-nya, jadi ketiga node di-scrape;
  # gunakan max by (queue) agar tidak dobel bila lebih dari satu node melapor.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbit-1:15692", "rabbit-2:15692", "rabbit-3:15692"]
