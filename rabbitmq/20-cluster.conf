# Klaster RabbitMQ 3 node (dipasang di /etc/rabbitmq/conf.d/ ketiga node).

cluster_name = puisi

# Peer discovery dari daftar statis: setiap node mencoba bergabung dengan node
# lain di daftar ini saat pertama kali start. Nama node = rabbit@<hostname>,
# jadi hostname container (docker-compose.yml) harus cocok.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3

# Node yang terpisah dari mayoritas (partisi jaringan) berhenti melayani
# alih-alih menerima tulisan yang nanti bentrok. Dengan 3 node, klaster tetap
# melayani selama 2 node saling terhubung.
cluster_partition_handling = pause_minority

# Leader quorum queue disebar ke semua node, bukan menumpuk di node pertama
# yang kebetulan dihubungi klien.
queue_leader_locator = balanced

# Quorum queue yang dibuat saat klaster belum lengkap (mis. node lain masih
# boot) otomatis ditambah anggotanya sampai 3 replika begitu node bergabung.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# Container dibatasi mem_limit 1g (docker-compose.yml). Tanpa nilai absolut,
# RabbitMQ menghitung batas dari RAM HOST dan bisa dibunuh OOM sebelum sempat
# menahan publisher. Di atas 512 MiB publisher ditahan (flow control).
vm_memory_high_watermark.absolute = 512MiB
