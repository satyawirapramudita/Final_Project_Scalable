# Override untuk deployment EC2 (production).
# Pakai: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  gateway:
    # Di EC2 gateway harus mendengarkan port 80: origin CloudFront maupun
    # akses langsung lewat Elastic IP. Port 8080 dari compose dasar tetap ada
    # (berguna untuk smoke test lokal) dan ditutup lewat Security Group.
    ports:
      - "80:80"
  gateway-b:
    # Origin kedua CloudFront origin group (lihat docs/deploy-aws-tutorial.md,
    # bagian origin failover). Buka port 81 di Security Group hanya untuk
    # prefix list CloudFront, sama seperti port 80.
    ports:
      - "81:80"
