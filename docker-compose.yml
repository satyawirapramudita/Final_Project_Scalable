name: puisi-scalable

# ─────────────────────────────────────────────────────────────
# Skeleton Compose (F0). Semua layanan masih berupa kerangka:
# hanya membuka /health dan /metrics. Logika bisnis menyusul
# pada fase F1–F4 sesuai rencana pengembangan.
# ─────────────────────────────────────────────────────────────

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-puisi}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}

services:
  # ── Gerbang tunggal (Lindra) ──────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: puisi-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      auth:
        condition: service_started
      poem:
        condition: service_started
    networks:
      - edge

  # ── Layanan HTTP (sinkron) ────────────────────────────────
  auth: # Ardi
    build: ./services/auth
    container_name: puisi-auth
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: auth
      PORT: "8001"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data

  poem: # Satya
    build: ./services/poem
    container_name: puisi-poem
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: poem
      PORT: "8002"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${POEM_DB_NAME:-poem_db}
      DB_USER: ${POEM_DB_USER:-poem_user}
      DB_PASSWORD: ${POEM_DB_PASSWORD}
      ASSET_BASE_URL: ${ASSET_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data

  wordcloud: # Lindra
    build: ./services/wordcloud
    container_name: puisi-wordcloud
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: wordcloud
      PORT: "8003"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${WORDCLOUD_DB_NAME:-wordcloud_db}
      DB_USER: ${WORDCLOUD_DB_USER:-wordcloud_user}
      DB_PASSWORD: ${WORDCLOUD_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data

  search: # Anders
    build: ./services/search
    container_name: puisi-search
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: search
      PORT: "8004"
    depends_on:
      redis:
        condition: service_started
    networks:
      - edge
      - data

  kbbi-linker: # Dzaky
    build:
      context: .
      dockerfile: services/kbbi-linker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: kbbi-linker
      PORT: "8005"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${KBBI_DB_NAME:-kbbi_db}
      DB_USER: ${KBBI_DB_USER:-kbbi_user}
      DB_PASSWORD: ${KBBI_DB_PASSWORD}
      KBBI_DATASET_VERSION: ${KBBI_DATASET_VERSION:-kbbi-v-local}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  tts: # Anders — ditunda/opsional
    build: ./services/tts
    container_name: puisi-tts
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: tts
      PORT: "8006"
    networks:
      - edge
      - data

  # ── Worker asinkron (tanpa API publik) ────────────────────
  nlp-worker: # Satya
    build: ./services/nlp-worker
    container_name: puisi-nlp-worker
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: nlp-worker
      PORT: "8100"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - data

  # ── Store ─────────────────────────────────────────────────
  mysql:
    image: mysql:8
    container_name: puisi-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  redis:
    image: redis:7-alpine
    container_name: puisi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: puisi-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-puisi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672" # management UI (dev)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - data

networks:
  edge:
    driver: bridge
  data:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
