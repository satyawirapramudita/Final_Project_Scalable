name: puisi-scalable

# ─────────────────────────────────────────────────────────────
# Skeleton Compose (F0). Semua layanan masih berupa kerangka:
# hanya membuka /health dan /metrics. Logika bisnis menyusul
# pada fase F1–F4 sesuai rencana pengembangan.
# ─────────────────────────────────────────────────────────────

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-puisi}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}

services:
  # ── Gerbang tunggal (Anders) ──────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: puisi-gateway
    restart: unless-stopped
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      # Hanya variabel API_* yang disubstitusi ke templates/default.conf.template.
      NGINX_ENVSUBST_FILTER: "^API_"
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20r/s}
      API_BURST: ${API_BURST:-40}
      # Micro-cache wordcloud/kbbi: zona cache (off = nonaktif) dan masa berlaku.
      API_CACHE: ${API_CACHE:-api_cache}
      API_CACHE_TTL: ${API_CACHE_TTL:-30s}
    volumes:
      # `z` menandai file/direktori host dengan label SELinux container_file_t —
      # tanpa ini, di host SELinux enforcing (Fedora/RHEL) proses container
      # mendapat "permission denied" saat membaca bind-mount meski mode 644.
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./gateway/templates:/etc/nginx/templates:ro,z
      - ./frontend:/usr/share/nginx/html:ro,z
    depends_on:
      auth:
        condition: service_started
      poem:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge

  # ── Layanan HTTP (sinkron) ────────────────────────────────
  auth: # Ardi
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    # Tanpa container_name: auth stateless (JWT), jadi bisa punya beberapa replika.
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat AUTH_REPLICAS
    # atau sementara: docker compose up -d --scale auth=N
    deploy:
      replicas: ${AUTH_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: auth
      PORT: "8001"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  poem: # Satya
    build:
      context: .
      dockerfile: services/poem/Dockerfile
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat POEM_REPLICAS
    # atau sementara: docker compose up -d --scale poem=N
    deploy:
      replicas: ${POEM_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: poem
      PORT: "8002"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${POEM_DB_NAME:-poem_db}
      DB_USER: ${POEM_DB_USER:-poem_user}
      DB_PASSWORD: ${POEM_DB_PASSWORD}
      ASSET_BASE_URL: ${ASSET_BASE_URL}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-86400}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  wordcloud: # Lindra
    build:
      context: .
      dockerfile: services/wordcloud/Dockerfile
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat WORDCLOUD_REPLICAS
    # atau sementara: docker compose up -d --scale wordcloud=N
    deploy:
      replicas: ${WORDCLOUD_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: wordcloud
      PORT: "8003"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${WORDCLOUD_DB_NAME:-wordcloud_db}
      DB_USER: ${WORDCLOUD_DB_USER:-wordcloud_user}
      DB_PASSWORD: ${WORDCLOUD_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  search: # Anders
    build:
      context: .
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat SEARCH_REPLICAS
    # atau sementara: docker compose up -d --scale search=N
    deploy:
      replicas: ${SEARCH_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: search
      PORT: "8004"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${SEARCH_DB_NAME:-search_db}
      DB_USER: ${SEARCH_DB_USER:-search_user}
      DB_PASSWORD: ${SEARCH_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  kbbi-linker: # Dzaky
    build:
      context: .
      dockerfile: services/kbbi-linker/Dockerfile
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat KBBI_REPLICAS
    # atau sementara: docker compose up -d --scale kbbi-linker=N
    deploy:
      replicas: ${KBBI_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: kbbi-linker
      PORT: "8005"
      DB_HOST: ${MYSQL_HOST:-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_NAME: ${KBBI_DB_NAME:-kbbi_db}
      DB_USER: ${KBBI_DB_USER:-kbbi_user}
      DB_PASSWORD: ${KBBI_DB_PASSWORD}
      KBBI_DATASET_VERSION: ${KBBI_DATASET_VERSION:-kbbi-v-local}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  tts: # Anders — ditunda/opsional
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    container_name: puisi-tts
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: tts
      PORT: "8006"
    networks:
      - edge
      - data

  # ── Worker asinkron (tanpa API publik) ────────────────────
  nlp-worker: # Satya
    build:
      context: .
      dockerfile: services/nlp-worker/Dockerfile
    restart: unless-stopped
    # Replika default 2 (redundansi + bagi beban); ubah lewat NLP_WORKER_REPLICAS
    # atau sementara: docker compose up -d --scale nlp-worker=N
    deploy:
      replicas: ${NLP_WORKER_REPLICAS:-2}
    labels:
      # dipantau layanan autoheal: restart otomatis bila health check gagal
      autoheal: "true"
    env_file: .env
    environment:
      <<: *common-env
      SERVICE_NAME: nlp-worker
      PORT: "8100"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data

  # ── Store ─────────────────────────────────────────────────
  mysql:
    image: mysql:8
    container_name: puisi-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  redis:
    image: redis:7-alpine
    container_name: puisi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: puisi-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-puisi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672" # management UI (dev)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro,z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - data

  # ── Observability (Anders) ────────────────────────────────
  # Port dibind ke 127.0.0.1 saja. Di EC2 akses lewat SSH tunnel:
  #   ssh -L 3000:localhost:3000 -L 9090:localhost:9090 ubuntu@<ip>
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: puisi-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: puisi-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://gateway:8081/stub_status
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge

  grafana:
    image: grafana/grafana:11.3.1
    container_name: puisi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/puisi-overview.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - edge

  # Self-healing: Docker Compose hanya me-restart container yang CRASH, bukan yang
  # health check-nya gagal ("unhealthy", mis. proses hidup tapi macet). autoheal
  # memantau container berlabel autoheal=true dan me-restart yang unhealthy.
  # Sengaja hanya layanan stateless; mysql/redis/rabbitmq/prometheus tidak dilabeli
  # karena me-restart penyimpan data saat beban tinggi bisa memperparah gangguan.
  # Catatan keamanan: akses docker.sock setara akses root ke Docker host.
  autoheal:
    # Tag 1.2.0 di Docker Hub adalah build 2021 yang cacat (binary `autoheal`
    # tidak ada → entrypoint gagal "autoheal: not found", exit 127). Tag resmi
    # yang didukung upstream hanya latest/1.1.0/v0.7.0. Dipin per-digest
    # (amd64, build upstream Dockerfile saat ini) demi supply chain.
    image: willfarrell/autoheal@sha256:47cac8b9c7cdf05114065d453fecc4e1c0eeab1dc06a635ea2764b6302e206ad
    container_name: puisi-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10       # detik antar pemeriksaan
      AUTOHEAL_START_PERIOD: 60   # tunggu stack selesai start sebelum mulai memantau
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    # label:disable: tanpa ini, di host SELinux enforcing container berlabel
    # container_t tidak boleh membuka /var/run/docker.sock ("unix socket is
    # currently not available"). Pola standar untuk container yang butuh
    # akses API Docker (autoheal, watchtower, portainer).
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

networks:
  edge:
    driver: bridge
  data:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
